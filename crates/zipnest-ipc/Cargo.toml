[package]
name = "zipnest-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IPC service layer: archive registry, open/list/read/extract orchestration. UI-framework free."

[dependencies]
archive-core = { path = "../archive-core" }
archive-jobs = { path = "../archive-jobs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The test_archive tests build a ZIP whose data area is corrupted on purpose
# (readable directory, failing CRC) — that needs a real ZIP writer.
zip = "6"
