name: ci

# Until v0.4.11 this repository had no CI at all: `cargo test`, clippy and the
# version checks were done by hand, and two of the last three releases shipped a
# user-visible regression that one of these steps would have caught (v0.4.9 fixed
# a stuck installer from v0.4.8; v0.4.10 fixed a flashing update window).
#
# The shipped app is `zipnest-native`; `apps/zipnest` is the older WebView2/Tauri
# UI that is NOT shipped (AGENTS.md). apps/zipnest/src-tauri is its own workspace
# now, so `--workspace` below means exactly the six shipped crates, and the
# frontend tests run only when apps/zipnest actually changed.

on:
  push:
    branches: [master]
    # A docs-only commit cannot break the build, the tests or the installer, so
    # it does not trigger a full test + clippy + release-build round.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# A push that lands while the previous run is still going used to leave both
# running: two full test+clippy rounds and two installer compiles for a tree
# only the newer one describes. Superseded runs of the same ref are cancelled;
# runs on different refs stay independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # `apps/zipnest` (the older, unshipped WebView2 UI) has a test suite that is
  # worth running when it changes and pure overhead when it does not. This job
  # answers "did it change?" once, so `frontend` can gate on it.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.frontend.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff <before> HEAD` needs the base commit to be present.
          fetch-depth: 0

      - name: did apps/zipnest change?
        id: frontend
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: the frontend job runs."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # A brand-new branch pushes 000...0 as `before`, and a force-push can
          # leave the old tip unreachable; fall back to the previous commit.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            echo "Base ${base:-<none>} (fallback to HEAD~1)"
          fi

          # Still nothing to diff against: a single-commit history. Be
          # conservative and run the frontend job rather than skip it silently.
          if [ -z "$base" ]; then
            echo "No base commit; assuming apps/zipnest changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" HEAD | grep -q "^apps/zipnest/"; then
            echo "apps/zipnest changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps/zipnest untouched."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test + clippy (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo clippy (workspace, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The release binaries are built once here and handed to the installer job as
  # an artifact. Building them again inside the installer job compiled the same
  # tree a second time for the same commit.
  release-build:
    name: release binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: shipped-release

      - name: cargo build (release)
        run: cargo build -p zipnest-native -p zipnest-shell --release

      - name: upload the binaries the installer packages
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          if-no-files-found: error
          path: |
            target/release/zipnest-native.exe
            target/release/zipnest_shell.dll

  installer:
    name: version strings + installer compiles
    runs-on: windows-latest
    needs: release-build
    steps:
      - uses: actions/checkout@v4

      - name: every version string agrees
        shell: pwsh
        run: ./packaging/check-versions.ps1

      - name: NSIS is available
        shell: pwsh
        run: |
          # community.chocolatey.org occasionally answers 504 and choco then
          # installs nothing while still exiting 0 (seen on master 2026-10-14 and
          # on PR #8), so the failure used to surface two steps later as a missing
          # makensis.exe. Retry the feed, then assert the binary really exists.
          $ok = $false
          foreach ($attempt in 1..3) {
            choco install nsis --no-progress -y
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { $ok = $true; break }
            Write-Warning "NSIS missing after attempt $attempt (chocolatey feed flake); retrying"
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { throw "NSIS did not install: makensis.exe not found" }
          "C:\Program Files (x86)\NSIS" | Out-File -Append $env:GITHUB_PATH

      - name: fetch the release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release

      - name: emit the payload and compile the installer
        shell: pwsh
        run: |
          # The Win11 shell package needs the code-signing key, which CI does not
          # have: emit the rest and let installer.nsi prove its syntax against it.
          ./packaging/emit-portable.ps1 -SkipWin11Shell
          # installer.nsi lists the Win11Shell files too, so placeholders stand in
          # for them here; only compilation is being checked, not the payload.
          New-Item -ItemType Directory -Force -Path dist-portable/ZipNest/Win11Shell | Out-Null
          foreach ($f in "ZipNestShell.msix","ZipNestCodesign.cer","install.ps1","uninstall.ps1") {
            Set-Content -Path "dist-portable/ZipNest/Win11Shell/$f" -Value "placeholder"
          }
          # zipnest_shell.dll is really built by the release-build job, so the
          # installer is compiled against the binary it would actually ship.
          Copy-Item -Path target/release/zipnest_shell.dll -Destination dist-portable/ZipNest/zipnest_shell.dll -Force
          Push-Location packaging
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Pop-Location

  frontend:
    name: older web UI (not shipped) — tests only
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/zipnest/pnpm-lock.yaml

      - name: pnpm test
        working-directory: apps/zipnest
        run: |
          pnpm install --frozen-lockfile
          pnpm test
