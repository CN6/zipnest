[package]
name = "zipnest-shell"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Windows 11 modern context menu (IExplorerCommand) for ZipNest"

[lib]
name = "zipnest_shell"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# `#[implement]` expands to absolute `windows_core::…` paths, so it has to be a
# direct dependency here (same version the `windows` crate uses).
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_UI_Shell",
] }
