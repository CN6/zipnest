[package]
name = "zipnest"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zipnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "=2.6.0"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
zipnest-ipc = { path = "../../../crates/zipnest-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# This app is not part of the root workspace (apps/zipnest is not shipped), so it
# is its own workspace root. Without this table cargo refuses the manifest with
# "current package believes it's in a workspace when it's not".
[workspace]
