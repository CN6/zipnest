[package]
name = "zipnest-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZipNest native UI (egui) — no WebView2"

[dependencies]
zipnest-ipc = { path = "../../crates/zipnest-ipc" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "links", "system_fonts", "x11", "wayland", "clipboard"] }
egui = "0.37"
# The parser epaint itself uses to load a face. `epaint::text::FontFace::new` is
# fallible on exactly one call — `skrifa::FontRef::from_index` — and
# `Family::new` turns that error into a panic, which under
# `windows_subsystem = "windows"` means the app starts and shows nothing. Asking
# skrifa first in `theme::install_fonts` is what keeps a replaced or damaged
# system font from doing that. Already in `Cargo.lock` as epaint's own
# dependency, with the same feature set, so this adds nothing to the build;
# keep the version in step with epaint's when it is upgraded.
skrifa = "0.44"
rfd = "0.18"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

[build-dependencies]
embed-resource = "2"
